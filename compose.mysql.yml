name: fraud-sentinel-local-db

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: fraud_sentinel
      MYSQL_USER: fraud_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run pnpm db:local:init first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run pnpm db:local:init first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1"
          >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  mysql_data:
